<!doctype html>
<html lang="de" class="locked">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#dfd2ba" />
  <title>three.js Demo 7 · Die Reihe</title>
  <meta name="description" content="Eine Straßenansicht von sechs Stadthäusern, die Haus für Haus die Sonne einfängt und Sie zum freien Haus führt. Variante B von Die Ansicht." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
  <link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js" />
  <link rel="modulepreload" href="../engine/elevation.js" />
  <link rel="modulepreload" href="../engine/quality.js" />
  <link rel="stylesheet" href="../engine/page.css" />
</head>
<body>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <div class="loader" id="loader">
    <p>PLAN // A-200 &nbsp;·&nbsp; Kreidegasse</p>
    <p class="soft">Plotte Straßenansicht 1:100 &nbsp;<span id="loadPct">0%</span></p>
  </div>

  <header class="topbar">
    <a class="mark" href="#">Kreidegasse<small>Sechs Stadthäuser · A-200</small></a>
    <a class="pill" href="#">Haus 04 reservieren</a>
  </header>

  <section class="hero" aria-label="Kreidegasse, Straßenansicht">
    <p class="kicker mono">Kreidegasse <span class="soft">&nbsp;·&nbsp; Straßenansicht 1:100</span></p>
    <h1><span class="mask"><span>Sechs Haustüren.</span></span><span class="mask"><span>Zwei noch <em>frei.</em></span></span></h1>
  </section>

  <div class="pins" id="pins" aria-hidden="true"></div>

  <div class="tb tb-top" aria-hidden="true">
    <div><span>Projekt</span>Kreidegasse</div>
    <div><span>Zeichnung</span>Straßenansicht</div>
    <div><span>Maßstab</span>1 : 100</div>
    <div><span>Blatt</span>A-200</div>
  </div>

  <div class="hint" aria-hidden="true">Scrollen <i></i></div>
  <div id="beats"></div>
  <main class="track" id="track"></main>

  <script type="importmap">
    { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    } }
  </script>
  <script type="module" src="page.js"></script>
<!-- three.js Portfolio: when this demo has played to its end, the next one starts by itself -->
<script src="/threejs-demos/portfolio.js" defer></script>
</body>
</html>
